<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Админка сайта</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23181818'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='34' fill='%23f6e8bf' font-family='Georgia,serif'%3EА%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/admin/admin.css">
</head>
<body>

<!-- Вход -->
<div class="login" id="login">
  <form class="login__box" id="login-form" autocomplete="on">
    <h1 class="login__title">Админка сайта</h1>
    <p class="login__text">Введите пароль, чтобы редактировать тексты, фото и видео.</p>
    <label class="login__label" for="password">Пароль</label>
    <input class="login__input" id="password" type="password" name="password" autocomplete="current-password" required>
    <button class="btn btn--main" type="submit">Войти</button>
    <div class="login__error" id="login-error" role="alert"></div>
  </form>
</div>

<!-- Рабочая область -->
<div class="app" id="app" hidden>
  <header class="bar">
    <div class="bar__left">
      <span class="bar__logo">Админка</span>
      <span class="bar__badge" id="storage-badge"></span>
    </div>
    <div class="bar__right">
      <span class="bar__status" id="status" role="status" aria-live="polite"></span>
      <a class="btn btn--ghost" href="index.html" target="_blank" rel="noopener">Открыть сайт</a>
      <button class="btn btn--ghost" type="button" id="reload">Отменить изменения</button>
      <button class="btn btn--main" type="button" id="save">Сохранить</button>
      <button class="btn btn--ghost" type="button" id="logout">Выйти</button>
    </div>
  </header>

  <div class="layout">
    <nav class="side" id="side" aria-label="Разделы"></nav>
    <main class="main" id="main"></main>
  </div>
</div>

<!-- Выбор файла из библиотеки -->
<div class="modal" id="picker" hidden>
  <div class="modal__box">
    <div class="modal__head">
      <h2 class="modal__title">Файлы сайта</h2>
      <button class="btn btn--ghost" type="button" data-picker-close>Закрыть</button>
    </div>
    <div class="modal__tools">
      <label class="btn btn--main upload">
        Загрузить файл
        <input type="file" id="picker-upload" accept="image/*,video/mp4" multiple hidden>
      </label>
      <span class="modal__hint">Фото — jpg, png, webp, svg. Видео — mp4. До 12 МБ на файл.</span>
    </div>
    <div class="modal__grid" id="picker-grid"></div>
  </div>
</div>

<script src="assets/admin/admin.js"></script>
</body>
</html>
